name: Validate COMOV B10 Python pilots

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Wi-Fi standard / PHY modes
        run: python3 scripts/check_wifi_modes.py
      - name: Validate P1 CSV analyser fixtures
        run: python3 scripts/test_p1_validation.py
      - name: Validate P2 FIFO analyser fixtures
        run: python3 scripts/test_p2_validation.py
      - name: Validate P2 paired-comparison analysis
        run: python3 scripts/test_p2_comparison.py
      - name: Validate P2 paired Student-t confidence intervals
        run: python3 scripts/test_p2_statistics.py
      - name: Validate B10 Wi-Fi contact analysis and AP robustness naming
        run: python3 scripts/test_p2_contact.py
      - name: Check ns-3 runner shell syntax
        run: bash -n scripts/run_p2.sh
      - name: Test P3 pilot matrix and independent stress source
        run: python3 scripts/test_p3_pilots.py
      - name: Check P3 runner shell syntax
        run: bash -n scripts/run_p3.sh
      - name: Validate P3 ARP radio capture and controlled diagnostic
        run: python3 scripts/test_p3_arp_diagnostic.py
